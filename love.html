<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بی نهایت دوستت دارم ❤️</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            margin: 0;
            padding: 20px;
            text-align: center;
            color: #333;
        }
        h1 {
            color: #d63031;
        }
        #controls {
            margin: 20px 0;
        }
        button {
            background-color: #e84393;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background-color: #d63031;
        }
        #counter {
            font-size: 18px;
            font-weight: bold;
            margin: 10px 0;
            color: #2d3436;
        }
        #log {
            background: white;
            border-radius: 8px;
            padding: 15px;
            max-height: 400px;
            overflow-y: auto;
            text-align: right;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            font-size: 14px;
            line-height: 1.8;
        }
    </style>
</head>
<body>

    <h1>تقدیم به عشقم ❤️</h1>
    <p>برنامه برای نوشتن تعداد زیادی «دوستت دارم» آماده است!</p>

    <div id="controls">
        <button onclick="startTyping()">شروع تایپ</button>
        <button onclick="stopTyping()">توقف</button>
        <button onclick="resetApp()">پاک کردن</button>
    </div>

    <div id="counter">تعداد چاپ شده: 0</div>
    <div id="log"></div>

    <script>
        let isRunning = false;
        let count = 0;
        const target = 10000000000000; // ۱۰ تریلیون
        let batchSize = 500; // تعداد در هر مرحله برای سرعت بالا و عدم فریز شدن مرورگر

        function startTyping() {
            if (isRunning) return;
            isRunning = true;
            typeBatch();
        }

        function typeBatch() {
            if (!isRunning) return;
            
            let logDiv = document.getElementById('log');
            let counterDiv = document.getElementById('counter');
            let fragment = document.createDocumentFragment();

            for (let i = 0; i < batchSize; i++) {
                if (count >= target) {
                    isRunning = false;
                    break;
                }
                count++;
                let p = document.createElement('div');
                p.textContent = `${count.toLocaleString('fa-IR')}- دوستت دارم ❤️`;
                fragment.appendChild(p);
            }

            logDiv.appendChild(fragment);
            counterDiv.textContent = `تعداد چاپ شده: ${count.toLocaleString('fa-IR')}`;
            logDiv.scrollTop = logDiv.scrollHeight;

            if (isRunning && count < target) {
                requestAnimationFrame(typeBatch);
            }
        }

        function stopTyping() {
            isRunning = false;
        }

        function resetApp() {
            isRunning = false;
            count = 0;
            document.getElementById('log.innerHTML').innerHTML = '';
            document.getElementById('log').innerHTML = '';
            document.getElementById('counter').textContent = `تعداد چاپ شده: 0`;
        }
    </script>

</body>
</html>
